name: fitsho
description: "FitSho — Persian health, fitness & nutrition assistant mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bot_toast: ^4.1.3
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  curl_logger_dio_interceptor: ^1.0.0
  dio: ^5.7.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  fpdart: ^1.1.1
  get_it: ^8.0.2
  go_router: ^14.8.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  hooks_riverpod: ^2.6.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.5.0
  otp_autofill: ^4.1.0
  pinput: ^5.0.0
  retrofit: 4.4.2
  riverpod_annotation: ^2.6.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.5.4
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  hive_ce_generator: ^1.9.2
  json_serializable: ^6.9.4
  retrofit_generator: 9.1.9
  riverpod_generator: ^2.6.4
  riverpod_lint: ^2.6.4
  very_good_analysis: ^7.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0E1319"
  adaptive_icon_background: "#0E1319"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    # Design rationale: Vazirmatn UI-FD — optimized metrics + Persian digits for RTL UI.
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-UI-FD-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-UI-FD-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-UI-FD-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-UI-FD-Bold.ttf
          weight: 700
